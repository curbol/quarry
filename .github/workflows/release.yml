name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || {
            echo "Error: tag must point to a commit on main"
            exit 1
          }

  test:
    needs: check-branch
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The linker silently ignores -X for a symbol that does not exist, so moving or
      # renaming main.version ships every binary reporting DevVersion — which is exactly
      # what `quarry update` refuses to run on, for everyone who installs it, with the
      # update path itself being the recovery. Nothing else catches that: the build
      # succeeds, main_test.go asserts against the same variable whatever its value, and
      # install.sh only checks that `quarry version` exits 0.
      - name: Verify the version stamp reaches the binary
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          go build -ldflags "-X main.version=${VERSION}" -o /tmp/quarry-stamp .
          got=$(/tmp/quarry-stamp version | awk '{print $2}')
          if [ "$got" != "$VERSION" ]; then
            echo "version stamp is '$got', want '$VERSION': -X did not reach main.version"
            exit 1
          fi

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist

          platforms=(
            "darwin/amd64/mac-intel"
            "darwin/arm64/mac-apple"
            "linux/amd64/linux-intel"
            "linux/arm64/linux-arm64"
            "windows/amd64/win"
          )

          for p in "${platforms[@]}"; do
            IFS='/' read -r goos goarch label <<< "$p"
            bin="quarry"
            if [ "$goos" = "windows" ]; then bin="quarry.exe"; fi

            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags "-X main.version=${VERSION}" \
              -o "dist/$bin" .
            (cd dist && zip "quarry-${VERSION}-${label}.zip" "$bin" && rm "$bin")
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
