name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml as its gate, so the bar for tagging is exactly the bar for
  # merging rather than a second copy that drifts.
  workflow_call:

permissions:
  contents: read

# Successive pushes to a PR share one ref (refs/pull/N/merge), so an older run is
# testing a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The release builds these five for the first time after the tag is pushed, so
      # without this a platform-specific compile error is found by a failed release
      # rather than by the PR that introduced it, and the fix needs a new tag. The list
      # is release.yml's, and TestReleaseSuffixMatchesTheWorkflowLabels parses this loop
      # and that table and fails when they diverge — so a platform added there and not
      # here is caught by the suite rather than by the release.
      - name: Cross-compile the release platforms
        run: |
          for p in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            echo "building $p"
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null .
          done

      # install.sh is the only install path and the only recovery when `quarry update`
      # refuses a dev build, and nothing else here reads it: the guard tests in
      # selfupdate parse it as text for its platform labels, so a stray brace or a
      # missing `fi` passes them and merges. This is a parse, not a run — the script
      # downloads a release and writes to ~/.local/bin.
      - name: install.sh parses
        run: bash -n install.sh

      # The tag store is mutated under a mutex by concurrent requests, and scanning
      # fans out over the tree, so the suite is worth running under the detector.
      - run: go test -race ./...

  # The grid's card recycling, the thumbnail worker's job dispatch, which renders stay
  # resident and which object URLs that releases, what the preview-character registry
  # holds and when a rig search may evict from it, rig matching, folding a tag edit into
  # a card, deciding where a padded clip stops, and which fonts a scroll may drop are
  # arithmetic, message ordering and set logic: a mistake in any of them leaves the UI
  # working and merely slow, leaking, or subtly wrong, which is what no Go test and no
  # eye reliably catches. The pure halves live in assets/gridwindow.js, jobtracker.js,
  # thumbcache.js, fontcache.js, rigmatch.js, tagedit.js, cliptrim.js and charstore.js,
  # and are checked here. Node's own test runner, no package.json and nothing installed,
  # so this stays a runtime rather than an ecosystem.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test 'internal/browse/jstest/*.test.mjs'
