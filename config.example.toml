# quarry config. Copy to your config dir as config.toml:
#   $XDG_CONFIG_HOME/quarry/config.toml, else ~/.config/quarry/config.toml
# (or point --config / QUARRY_CONFIG_DIR somewhere else).
#
# Everything here has a flag equivalent; the file just saves you from retyping.

# The directory quarry scans. This is the one setting with no default: point it at
# the tree holding your asset packs, whatever their vendor. A leading ~ is expanded.
# Overridden by QUARRY_ROOT and by --root.
root = "/path/to/your/assets"

# Walk symlinked directories that point outside the scan root, for a library spread
# across several drives and stitched together with links. Off by default: quarry only
# serves files the scan covered, and following a link is what puts its target in that
# set. Overridden by --follow-symlinks.
# follow_symlinks = true
