name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml as its gate, so the bar for tagging is exactly the bar for
  # merging rather than a second copy that drifts.
  workflow_call:

permissions:
  contents: read

# A push to a PR branch would otherwise run twice (once for the push, once for the
# pull_request); superseded runs on the same ref are also pointless once a newer
# commit exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # The tag store is mutated under a mutex by concurrent requests, and scanning
      # fans out over the tree, so the suite is worth running under the detector.
      - run: go test -race ./...

  # The grid's card recycling, the thumbnail worker's job dispatch, rig matching and
  # folding a tag edit into a card are arithmetic, message ordering and set logic: a
  # mistake in any of them leaves the UI working and merely slow or subtly wrong, which
  # is what no Go test and no eye reliably catches. The pure halves live in
  # assets/gridwindow.js, jobtracker.js, rigmatch.js and tagedit.js and are checked
  # here. Node's own test runner, no package.json and nothing installed, so this stays a
  # runtime rather than an ecosystem.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test 'internal/browse/jstest/*.test.mjs'
